<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaapi AI Setup Prototype</title>
<meta name="description" content="Working prototype of Zaapi's proposed AI agent setup: drafted from what the merchant already has, with a readiness check before go-live. Simulated data.">
<style>
/* Tokens: Zaapi's (prototype/tokens.css), sized up as the Stitch designs specify (stitch/DESIGN.md sections 4-6). */
:root{
  --font:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  --g25:#fcfcfd;--g50:#f9fafb;--g100:#f2f4f7;--g200:#eaecf0;--g300:#d0d5dd;--g400:#98a2b3;--g500:#667085;--g600:#475467;--g700:#344054;--g800:#1d2939;--g900:#101828;
  --brand:#09c8ab;--brand6:#00a892;--brand7:#008a77;--brand50:#e6f9f6;
  --purple:#5e40e1;--indigo:#444ce7;
  --ai:linear-gradient(94deg,#1ed1bb 0%,#5e40e1 140%);
  --ai-light:linear-gradient(135deg,rgba(30,209,187,.09) 0%,rgba(94,64,225,.09) 100%);
  --ai-border:rgba(94,64,225,.22);
  --ai-text:linear-gradient(90deg,#008a77,#875bf7);
  --upsell:linear-gradient(79deg,#1d2939 50%,#52729f 101%);
  --ok-bg:#ecfdf3;--ok:#067647;--ok-b:#abefc6;
  --warn-bg:#fffaeb;--warn:#b54708;--warn-b:#fedf89;
  --err-bg:#fef3f2;--err:#b42318;--err-b:#fecdca;--err5:#f04438;
  --proj-bg:#f4f3ff;--proj:#5925dc;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  --notes-w:300px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:14px}
body{margin:0;font-family:var(--font);font-size:14px;line-height:22px;color:var(--g800);background:var(--g50);-webkit-font-smoothing:antialiased;overflow:hidden;min-width:1024px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand7);text-decoration:none;cursor:pointer}
svg{flex-shrink:0}
h1,h2,h3,p{margin:0}

/* ---------- Top bar ---------- */
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--g200);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;position:relative;z-index:40}
.trial{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--g600)}
.trial b{color:var(--g900);font-weight:600}
.btn-sub{height:32px;padding:0 14px;border:0;border-radius:7px;background:var(--upsell);color:#fff;font-weight:500}
.demo{justify-self:end;display:flex;align-items:center;gap:4px;border:1px dashed var(--g400);border-radius:6px;padding:3px 4px 3px 10px;background:var(--g50);font-size:12.5px;font-weight:500;color:var(--g600);position:relative}
.demo .lbl{color:var(--g400);letter-spacing:.06em;font-size:11px;margin-right:4px}
.demo button{border:0;background:none;padding:4px 8px;border-radius:5px;color:var(--g600);font-weight:500;white-space:nowrap}
.demo button:hover{background:var(--g100)}
.demo .who{color:var(--g900);display:flex;align-items:center;gap:6px}
.demo .who img{width:20px;height:20px;border-radius:50%}
.demo .sep{width:1px;height:18px;background:var(--g300)}

/* Merchant switcher */
.switcher{position:absolute;top:calc(100% + 6px);right:0;width:460px;background:#fff;border:1px dashed var(--g400);border-radius:10px;box-shadow:0 12px 24px -6px rgba(16,24,40,.18);padding:8px;z-index:60;font-size:13px}
.switcher .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px;color:var(--g500);font-size:12px}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.mrow:hover{background:var(--g50)}
.mrow.on{background:var(--brand50);border-color:#b7eee5}
.mrow img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.mrow .nm{font-weight:600;color:var(--g900)}
.mrow .ct{color:var(--g500);font-weight:400}
.mrow .q{color:var(--g600);font-size:12.5px;line-height:18px;margin-top:2px}
.mrow .sc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.impact{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:#eef0ff;color:#3538cd;font-size:12px;font-weight:600;white-space:nowrap}
.feat{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600;border:1px solid var(--warn-b);white-space:nowrap}
.switcher .shortcuts{border-top:1px dashed var(--g300);margin-top:6px;padding:10px 8px 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--g500);font-size:12px}
.switcher .shortcuts select{height:30px;border:1px solid var(--g300);border-radius:6px;padding:0 6px;background:#fff;font-size:12.5px}
.chipbtn{height:30px;padding:0 10px;border:1px solid var(--g300);border-radius:6px;background:#fff;font-size:12.5px;font-weight:500;color:var(--g700)}
.chipbtn:hover{background:var(--g50)}

/* ---------- Shell ---------- */
.shell{display:flex;height:calc(100vh - 52px)}
.rail{width:72px;min-width:72px;background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;position:relative;z-index:30}
.rail .ib{position:relative;width:40px;height:36px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;color:var(--g500)}
.rail .ib:hover,.rail .ib.on{background:var(--g100)}
.rail .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--err5);border:1.5px solid #fff}
.rail .div{width:32px;height:1px;background:var(--g200);margin:6px 0}
.rail .sec{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:7px 0 6px;border-radius:8px;color:var(--g600);border:0;background:none;position:relative}
.rail .sec span{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.01em}
.rail .sec:hover{background:var(--g50)}
.rail .sec.on{background:#e6f9f6;color:var(--brand7)}
.rail .sec.on span{font-weight:600}
.rail .grow{flex:1}
.tip{position:fixed;z-index:90;background:var(--g900);color:#fff;font-size:12px;line-height:16px;padding:6px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tip small{display:block;color:#cbd5e1;font-size:11px}
.submenu{width:232px;min-width:232px;background:var(--g50);border-right:1px solid var(--g200);padding:16px 12px;overflow:auto}
.submenu h4{margin:0 0 12px 6px;font-size:14px;font-weight:600;color:var(--g800)}
.submenu .grp{margin-bottom:6px}
.submenu .gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:6px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--g500)}
.submenu .it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:13px;color:var(--g700);text-align:left}
.submenu .it:hover{background:#edeff4}
.submenu .it.on{background:#edeff4;font-weight:600;color:var(--g900)}
.submenu .note{font-size:11.5px;line-height:16px;color:var(--g500);padding:10px 6px 0;border-top:1px dashed var(--g300);margin-top:10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto}
.page{max-width:1104px;margin:0 auto;padding:36px 32px 56px}
.footer{height:68px;min-height:68px;background:#fff;border-top:1px solid var(--g200);display:flex;align-items:center;gap:14px;padding:0 32px}
.footer .fin{max-width:1040px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px}
.footer .hint{margin-left:auto;color:var(--g500);font-size:13px}
.footer .hint.warn{color:var(--warn);font-weight:500}
.saved{display:inline-flex;align-items:center;gap:6px;color:var(--g500);font-size:13px}
.saved svg{color:var(--brand6)}

/* ---------- Type ---------- */
.h1{font-size:26px;line-height:34px;font-weight:600;color:var(--g900);letter-spacing:-.01em}
.sub{color:var(--g600);font-size:14px;margin-top:4px}
.h2{font-size:18px;line-height:26px;font-weight:600;color:var(--g900)}
.h3{font-size:15px;line-height:22px;font-weight:600;color:var(--g900)}
.cap{font-size:12px;line-height:18px;color:var(--g500)}
.muted{color:var(--g500)}
.sec-lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g500)}
.ai-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ai-lbl span,.ai-text{background:var(--ai-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.ai-lbl svg{color:#3f7fd6}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.b{font-weight:600}

/* ---------- Surfaces ---------- */
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:24px;box-shadow:var(--shadow)}
.card.tight{padding:16px 20px}
.ai-card{background:#fff;position:relative;border:1px solid var(--ai-border);border-radius:12px;padding:24px;overflow:hidden}
.ai-card::before{content:"";position:absolute;inset:0;background:var(--ai-light);pointer-events:none}
.ai-card>*{position:relative}
.banner{display:flex;align-items:center;gap:12px;border-radius:10px;padding:12px 16px;border:1px solid var(--g200);background:#fff}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-b);color:#93370d}
.banner.err{background:var(--err-bg);border-color:var(--err-b);color:var(--err)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-b);color:var(--ok)}
.banner.info{background:#f5f8ff;border-color:#d1e0ff;color:#1d4ed8}
.banner .act{margin-left:auto}
.icon-tile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- Buttons ---------- */
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--g300);background:#fff;color:var(--g800);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--g50)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--ai);border:0;color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--g800);color:#fff;border:0}
.btn:disabled,.btn.primary:disabled{background:var(--g100);color:var(--g400);border:1px solid var(--g200);cursor:not-allowed;box-shadow:none;filter:none}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--g600)}
.btn.ghost:hover{background:var(--g100)}
.btn.ok{border-color:var(--ok-b);color:var(--ok);background:var(--ok-bg)}
.link{border:0;background:none;padding:0;color:var(--brand7);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--g100);color:var(--g600);border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-b)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
.chip.err{background:var(--err-bg);color:var(--err);border-color:var(--err-b)}
.chip.teal{background:var(--brand50);color:var(--brand7);border-color:#b7eee5}
.chip.prog{background:#f4f3ff;color:#5925dc;border-color:#d9d6fe}
.chip.proj{background:var(--proj-bg);color:var(--proj);border:1px dashed #9b8afb}
.chip.line{background:#fff;border-color:var(--g200);color:var(--g700)}
.chip.fact{background:#eef4ff;color:#3538cd;border-color:#c7d7fe}
.chip.rule{background:#f9f5ff;color:#6941c6;border-color:#e9d7fe}
.chip.live{background:var(--g100);color:var(--g600);border-color:var(--g200)}
.chip.demo{background:#fff;border:1px dashed var(--g400);color:var(--g500)}
.chip .n{color:var(--g400);font-weight:400}
.pill-btn{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--g200);background:#fff;font-size:13px;color:var(--g700);display:inline-flex;align-items:center;gap:6px}
.pill-btn.on{background:#fff;border-color:var(--g300);font-weight:600;color:var(--g900);box-shadow:var(--shadow)}

/* ---------- Home ---------- */
.reassure{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--g200);border-radius:10px;padding:12px 16px;color:var(--g700)}
.progress{height:8px;border-radius:4px;background:var(--g200);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.progress.ai>i{background:var(--ai)}
.home-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}
.next-title{font-size:20px;line-height:28px;font-weight:600;color:var(--g900);margin:10px 0 8px}
.stepper{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.srow{display:flex;align-items:center;gap:16px;padding:16px 24px;border-top:1px solid var(--g100)}
.srow:first-child{border-top:0}
.srow.cur{background:var(--ai-light);background-color:#fbfbff}
.snum{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;background:var(--g100);color:var(--g500)}
.snum.done{background:var(--brand);color:#fff}
.snum.cur{background:#fff;color:var(--purple);border:2px solid var(--purple)}
.snum.att{background:var(--warn-bg);color:var(--warn);border:2px solid #fdb022}
.sname{font-size:15px;font-weight:600;color:var(--g900)}
.sdesc{color:var(--g600);font-size:13.5px}
.stime{color:var(--g500);font-size:13px}

/* ---------- Mini tracker ---------- */
.mini{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:12px 20px;margin-bottom:24px;cursor:pointer}
.mini:hover{border-color:var(--g300)}
.dots{display:flex;align-items:center}
.dots .d{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff}
.dots .d i{width:8px;height:8px;border-radius:50%;background:var(--g300)}
.dots .d.done{background:var(--brand);color:#fff}
.dots .d.cur{border:2px solid var(--brand6)}
.dots .d.cur i{background:var(--brand6);width:9px;height:9px}
.dots .d.att{border:2px solid #fdb022}
.dots .d.att i{background:#f79009}
.dots .ln{width:12px;height:2px;background:var(--g200)}
.dots .ln.done{background:var(--brand)}
.mini .txt{font-size:13.5px;color:var(--g600)}
.mini .txt b{color:var(--g900)}
.mini .right{margin-left:auto;display:flex;align-items:center;gap:16px}

/* ---------- Step 1 ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.tile .top{display:flex;gap:12px;align-items:flex-start}
.tile .nm{font-weight:600;color:var(--g900)}
.tile .ft{margin-top:auto;padding-top:10px;border-top:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.tile.dashed{border-style:dashed;background:transparent}
.tile ul.tl{margin:0;padding-left:16px;font-size:13px;line-height:19px;color:var(--g700)}
.tile ul.tl li{margin:2px 0}
.upsell-strip{display:flex;align-items:center;gap:8px;background:var(--proj-bg);border:1px solid #d9d6fe;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:17px;color:#3f2a9e;margin-top:8px}
.upsell-strip .btn{height:30px;padding:0 10px;font-size:12.5px;flex-shrink:0}
.logo{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--g200);border:0;position:relative;padding:0;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2);transition:left .2s}
.toggle.on{background:var(--ai)}
.toggle.on::after{left:22px}
.toggle:disabled{opacity:.7;cursor:not-allowed}
.cbx{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.cbx i{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--g300);display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0}
.cbx.on i{background:var(--brand6);border-color:var(--brand6);color:#fff}
.split{height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--g200)}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px;color:var(--g700);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}

/* ---------- Loader ---------- */
.spin{width:16px;height:16px;border:2px solid var(--g200);border-top-color:var(--brand6);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{display:flex;flex-direction:column;gap:10px}
.shimmer{background:linear-gradient(90deg,var(--g100) 0%,#fff 50%,var(--g100) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Step 2 ---------- */
.src{border-top:1px solid var(--g100)}
.src:first-child{border-top:0}
.src-h{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
.src-h:hover{background:var(--g25)}
.src-body{padding:0 20px 16px 74px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--g100);font-size:13.5px}
.item:first-child{border-top:0}
.item .grow small{display:block;color:var(--g500);font-style:italic;font-size:12px}
.conf{border:1px solid var(--g200);border-radius:12px;background:#fff;margin-bottom:12px}
.conf.open{border:2px solid #fdd35d}
.conf .ch{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.conf .cb{padding:0 20px 20px}
.conf.done{border-color:var(--ok-b);background:#fcfffd}
.ydot{width:10px;height:10px;border-radius:50%;background:#f79009;flex-shrink:0}
.twosrc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.srcbox{border:1px solid var(--g200);border-radius:10px;padding:14px 16px;background:var(--g25)}
.srcbox.new{border-color:#99e6d8;background:#f6fefc}
.srcbox .sl{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--g500);display:flex;justify-content:space-between;gap:8px;align-items:center}
.srcbox .q{margin-top:8px;background:#fff;border:1px solid var(--g200);border-radius:8px;padding:10px 12px;font-style:italic;color:var(--g800)}
.drop{border:1.5px dashed var(--g300);border-radius:12px;padding:26px;text-align:center;color:var(--g600);background:#fff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand6);background:#f6fefc}
.learn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.learn>div{border:1px solid var(--g200);border-radius:10px;padding:12px 14px;background:#fff;font-size:13px;line-height:19px;color:var(--g700);display:flex;flex-direction:column;gap:6px}
.learn>div.on{border-color:#99e6d8;background:#f6fefc}
.learn .lt{font-weight:600;color:var(--g900);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.learn .lb{margin-top:auto;padding-top:4px}

/* ---------- Drawer ---------- */
.overlay{position:fixed;left:0;top:0;bottom:0;background:rgba(16,24,40,.42);z-index:70;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;bottom:0;width:600px;max-width:calc(100vw - 420px);background:#fff;z-index:75;display:flex;flex-direction:column;box-shadow:-12px 0 30px -12px rgba(16,24,40,.25)}
.drawer .dh{padding:26px 28px 18px;border-bottom:1px solid var(--g100)}
.drawer .db{flex:1;overflow:auto;padding:20px 28px 28px;background:#fff}
.drawer .df{height:76px;border-top:1px solid var(--g200);display:flex;align-items:center;gap:12px;padding:0 28px;background:#fff}
.xbtn{border:0;background:none;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.xbtn:hover{background:var(--g100)}
.part{border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:14px}
.part .ph{display:flex;align-items:center;gap:12px}
.part .pn{width:26px;height:26px;border-radius:50%;background:var(--g100);color:var(--g600);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0}
.part .pn.ok{background:var(--brand);color:#fff}
.part .pt{font-weight:600;color:var(--g900);font-size:14.5px}
.radio{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--g200);border-radius:10px;margin-top:10px;cursor:pointer;background:#fff}
.radio:hover{border-color:var(--g300)}
.radio.on{border:2px solid var(--brand);background:#f6fefc;padding:12px 13px}
.radio .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--g300);margin-top:2px;flex-shrink:0;background:#fff}
.radio.on .rd{border:5px solid var(--brand6)}
.radio .rl{font-weight:500;color:var(--g900)}
.rec{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--brand6);color:#fff;font-size:11px;font-weight:600;margin-left:8px;vertical-align:1px}
.order{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.order .o{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border:1px solid var(--g200);border-radius:7px;background:#fff;font-size:13px}
.order .o:first-child{border-color:#99e6d8;color:var(--brand7);font-weight:600}
.order .o button{border:0;background:none;width:20px;height:20px;border-radius:4px;color:var(--g500);padding:0;display:flex;align-items:center;justify-content:center}
.order .o button:hover{background:var(--g100)}
.copybox{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.textarea{width:100%;min-height:84px;border:1px solid var(--g300);border-radius:8px;padding:10px 12px;resize:vertical;background:#fff}
.textarea:focus,.input:focus,select.input:focus{outline:2px solid #b7eee5;border-color:var(--brand6)}
.input{height:40px;border:1px solid var(--g300);border-radius:8px;padding:0 12px;background:#fff;width:100%}

/* ---------- Step 3 ---------- */
.seg{display:inline-flex;background:var(--g100);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--g600);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--g900);font-weight:600;box-shadow:var(--shadow)}
.seg .cnt{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:0 6px;line-height:16px}
.topic{background:#fff;border:1px solid var(--g200);border-radius:12px;margin-bottom:12px}
.topic.ai{border-color:var(--ai-border);position:relative;overflow:hidden}
.topic.ai::before{content:"";position:absolute;inset:0;background:var(--ai-light);pointer-events:none}
.topic>*{position:relative}
.topic .th{display:flex;align-items:center;gap:12px;padding:16px 20px}
.topic .tb{padding:0 20px 18px}
.topic.off{opacity:.62}
.tnum{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:12.5px;flex-shrink:0}
.tnum.ok{background:var(--ok-bg);color:var(--ok)}
.tnum.off{background:var(--g100);color:var(--g400)}
.chat{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:14px 16px}
.bub{max-width:78%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:20px}
.bub.cust{background:var(--g100);color:var(--g800);border-top-left-radius:4px}
.bub.agent{margin-left:auto;background:#fff;border:1px solid #bfe9e2;position:relative;border-top-right-radius:4px;overflow:hidden}
.bub.agent::before{content:"";position:absolute;inset:0;background:var(--ai-light);pointer-events:none}
.bub.agent>*{position:relative}
.bub .who{font-size:11px;font-weight:600;margin-bottom:2px}
.bub.bad{margin-left:auto;background:var(--err-bg);border:1px solid var(--err-b);border-top-right-radius:4px}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;background:var(--g200);color:var(--g600)}
.avatar.z{background:var(--brand);color:#fff}
.more{background:var(--g50);border:1px solid var(--g200);border-radius:12px;padding:20px 24px}
.staffcard{border:1px solid var(--g200);border-radius:10px;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}

/* ---------- Step 4 ---------- */
.v-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}
.field{padding:20px 0;border-top:1px solid var(--g100)}
.field:first-child{border-top:0;padding-top:0}
.field .fh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.segx{display:flex;background:var(--g100);border:1px solid var(--g200);border-radius:10px;padding:4px;gap:4px}
.segx button{flex:1;border:1px solid transparent;background:none;height:38px;border-radius:7px;color:var(--g600);font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.segx button.on{background:#fff;border-color:var(--brand);color:var(--brand7);font-weight:600;box-shadow:var(--shadow)}
.segx button.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand6)}
.picked{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--brand50);color:var(--brand7);font-size:12px;font-weight:500;border:1px solid #b7eee5;white-space:nowrap}
.preview{position:sticky;top:0}
.phone{background:#f7f6f2;border:1px solid var(--g200);border-radius:14px;padding:16px;background-image:radial-gradient(var(--g200) 1px,transparent 1px);background-size:16px 16px}

/* ---------- Step 5 ---------- */
.run{text-align:center}
.run .big{font-size:24px;line-height:32px;font-weight:600;color:var(--g900);max-width:640px;margin:18px auto 6px}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.counter{border-radius:10px;padding:12px;text-align:center;border:1px solid var(--g200)}
.counter .v{font-size:26px;font-weight:700;line-height:32px}
.counter.c{background:#f6fefc;border-color:#b7eee5;color:var(--brand7)}
.counter.h{background:#f5fbff;border-color:#c7e4f5;color:#0e7090}
.counter.w{background:var(--err-bg);border-color:var(--err-b);color:var(--err)}
.stream .srow2{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--g200);border-radius:10px;padding:10px 14px;margin-top:8px;text-align:left;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.ring{width:124px;height:124px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:40px;line-height:44px;font-weight:700;color:var(--g900)}
.bar{height:8px;border-radius:4px;background:var(--g100);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.res-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:28px;align-items:center}
.wrong{background:#fff;border:1px solid var(--g200);border-radius:12px;margin-bottom:12px;overflow:hidden}
.wrong.open{border-left:4px solid var(--err5)}
.wrong.fixed{border-left:4px solid var(--brand)}
.wrong .wh{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer}
.wrong .wb{padding:4px 22px 20px}
.said{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.said>div{border-radius:10px;padding:12px 14px}
.said .x{background:var(--err-bg);border:1px solid var(--err-b)}
.said .y{background:#f6fefc;border:1px solid #b7eee5}
.said .q{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden;font-size:13.5px}
.tbl th{background:var(--g50);color:var(--g700);font-weight:500;text-align:left;padding:12px 18px;height:48px;border-bottom:1px solid var(--g200)}
.tbl td{padding:12px 18px;border-top:1px solid var(--g100)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.contrast{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.strike{text-decoration:line-through;color:var(--g400)}

/* ---------- Step 6 ---------- */
.gl-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}
.trow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--g100)}
.trow:first-child{border-top:0}
.trow.x{background:var(--warn-bg);margin:0 -24px;padding:13px 24px}
.chk{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 14px;border:1px solid var(--g200);border-radius:9px;background:#fff;cursor:pointer;font-weight:500}
.chk.on{border:2px solid var(--brand);padding:0 13px;background:#f6fefc}
.chk i{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--g300);display:flex;align-items:center;justify-content:center}
.chk.on i{background:var(--brand6);border-color:var(--brand6);color:#fff}
select.input{appearance:auto}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.stat .v{font-size:30px;line-height:38px;font-weight:700;color:var(--g900);letter-spacing:-.01em}
.stat .l{color:var(--g600);margin-top:4px;font-size:13.5px;line-height:19px}
.todo{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden}
.todo .tr{display:flex;align-items:center;gap:16px;padding:18px 24px;border-top:1px solid var(--g100)}
.todo .tr:first-child{border-top:0}
.todo .tr.sale{background:#fffdf5}

/* ---------- Presenter notes ---------- */
.notes{width:var(--notes-w);min-width:var(--notes-w);background:var(--g100);border-left:2px dashed var(--g400);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:20}
.notes.collapsed{width:30px;min-width:30px;cursor:pointer}
.notes .tab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--g500);padding:16px 0;margin:0 auto}
.notes .nb{flex:1;overflow:auto;padding:20px 18px 12px}
.notes .pl{font-size:11px;font-weight:600;letter-spacing:.1em;font-variant:small-caps;text-transform:uppercase;color:var(--g500);display:flex;justify-content:space-between;align-items:center}
.notes .pl button{border:0;background:none;font-size:11px;color:var(--g500);text-transform:none;letter-spacing:0;padding:2px 4px;border-radius:4px}
.notes .pl button:hover{background:var(--g200)}
.notes .nt{font-size:16px;font-weight:600;color:var(--g900);margin:6px 0 14px;line-height:22px}
.nchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--g200);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.nchip img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.nblk{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:13px;line-height:19px;color:var(--g700)}
.nblk .nl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.nblk.today .nl{color:#d92d20}.nblk.change .nl{color:var(--brand7)}.nblk.why .nl{color:var(--purple)}.nblk.move .nl{color:#0e7090}.nblk.indemo .nl{color:var(--g600)}.nblk.line .nl{color:#06a54a}
.nblk.indemo{background:#fffdf5;border-style:dashed}
.nblk .src{color:var(--g400);border:0}
.ntrack{border-top:1px dashed var(--g400);padding:10px 18px 10px;background:#eceef2;max-height:42%;overflow:auto}
.ntrack .th{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:13px;color:var(--g900)}
.ntrack .th span{color:var(--purple)}
.ntrack ul{list-style:none;margin:6px 0 0;padding:0;font-size:12px;line-height:16px}
.ntrack li{display:flex;gap:7px;align-items:flex-start;padding:1.5px 0;color:var(--g400)}
.ntrack li.on{color:var(--g800)}
.ntrack li i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--g300);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ntrack li.on i{border:0;background:var(--brand6);color:#fff}
.ntrack .all{font-size:11.5px;color:var(--g500);margin-top:6px}

.modal-wrap{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 20px 40px -8px rgba(16,24,40,.25)}
.modal.wide{width:820px}
.modal .mh{padding:22px 24px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal .mb{padding:4px 24px 20px;overflow:auto}

.modal.demo-modal{border:2px dashed var(--g400)}
.etbl{width:100%;border-collapse:collapse;font-size:13.5px}
.etbl th{text-align:left;font-weight:500;color:var(--g700);padding:8px;background:var(--g50);border-bottom:1px solid var(--g200)}
.etbl td{padding:6px 8px;border-bottom:1px solid var(--g100)}
.etbl input{height:34px;border:1px solid var(--g200);border-radius:6px;padding:0 8px;width:100%}
.etbl input.gap{border-color:#fdb022;background:var(--warn-bg)}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--ok-b);color:var(--ok);border-radius:10px;padding:10px 16px;font-weight:500;box-shadow:0 10px 24px -6px rgba(16,24,40,.2);z-index:95;display:flex;align-items:center;gap:8px;animation:fadein .2s;max-width:640px}
.toast.demo{border:1px dashed var(--g400);color:var(--g700)}
.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(9,200,171,.35)}100%{box-shadow:none}}
.kit-row{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.kit-row .ck{width:24px;height:24px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d6fe;border-radius:12px;background:#f8f7ff;overflow:hidden}
.cmp>div{padding:16px 18px}
.cmp>div+div{border-left:1px solid #d9d6fe}
.gq-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}
.qbar{display:flex;gap:6px;margin-top:10px}
.qbar i{flex:1;height:6px;border-radius:3px;background:var(--g200)}
.qbar i.on{background:var(--brand)}
.fcard{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.fcard.pend{border:1.5px dashed #6ce9d2;background:#f6fefc}
.empty{border:1.5px dashed var(--g300);border-radius:12px;padding:22px;text-align:center;color:var(--g500)}
.narrow{display:none}
@media (max-width:860px){body:not(.anyway) .narrow{display:flex;position:fixed;inset:0;z-index:100;background:var(--g50);align-items:center;justify-content:center;padding:24px 16px}
  body.anyway{overflow:auto}}
@media (max-width:1300px){.page{padding:28px 24px 48px}.tiles{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.footer .cap{display:none}.footer{padding:0 24px}}
@media (max-width:1180px){.v-grid,.gl-grid,.gq-grid,.home-grid{grid-template-columns:1fr}.preview{position:static}.demo .shop{display:none}.trial>span{display:none}.res-grid{grid-template-columns:auto 1fr!important}.res-grid>div:nth-child(n+3){grid-column:1/-1;border-left:0!important;padding-left:0!important}.said,.twosrc{grid-template-columns:1fr}}
.saved{white-space:nowrap}.footer .hint{text-align:right;line-height:18px}
</style>

function met(r){
  const s = st();
  if(r.topic) return ['accepted','edited'].includes(s.s3.t[r.topic]);
  if(r.flag) return !!s.flags[r.flag];
  if(r.conflict) return s.s2.conf[r.conflict] && s.s2.conf[r.conflict].status==='settled';
  if(r.warn) return !!s.s2.warn[r.warn];
  if(r.orderStatus) return s.s3.order;
  if(r.voice) return s.s4.speaks===r.voice;
  if(r.guided!=null) return !!s.s2.g.ans[r.guided];
  if(r.pick){ const c=s.s2.conf[r.pick[0]]; return !!c && c.status==='settled' && c.pick===r.pick[1]; }

}
const wrongFixed = w => w.needs.every(met);
function sources(){ const m=M(), s=st(); return [...(m.s2.preload||[]), ...(s.s2.loaded ? (m.s2.samples||[]) : []), ...s.s2.extra]; }
function allWarns(){ const out=[]; sources().forEach(f => (f.warns||[]).forEach(w => out.push(w))); return out; }
function blockers2(){
  const m=M(), s=st(), b=[];
  if(m.guided){ const left = m.guidedQs.length - Object.keys(s.s2.g.ans).length - Object.keys(s.s2.g.skip).length; if(left>0) b.push(`Answer or skip ${left} more question${left>1?'s':''}`); return b; }
  if(m.s2.samples && !m.s2.preload && !s.s2.loaded) b.push('Add your files first');
  const open = m.s2.conflicts.filter(c => !(s.s2.conf[c.id] && s.s2.conf[c.id].status==='settled')).length;
  if(open) b.push(`Settle ${open} thing${open>1?'s':''} to continue`);
  const w = allWarns().filter(x=>!s.s2.warn[x.id]).length;

}
function isDone(n, id=S.cur){

    case 3: return !!s.done[3] || (MERCHANTS[id].topics.every(t => (s.s3.t[t.id]||'review')!=='review') && !!s.seen[3]);
    case 5: return !!(s.s5.result && s.s5.result.frac===1);

/* ---------------- Readiness maths (demo data, derived from the presets) ---------------- */
function lerp(a,b,f){ return Math.round(a+(b-a)*f); }
function computeResult(){
  const m=M(), R=m.ready, list=R.wrong, fixedNow=list.filter(wrongFixed).map(w=>w.id);
  const f = fixedNow.length/list.length;
  const r = {}; ['c','h','w','cons','score'].forEach(k => r[k] = f===1 ? R.after[k] : f===0 ? R.before[k] : lerp(R.before[k],R.after[k],f));
  const left = list.length-fixedNow.length;
  r.verdict = f===1 ? R.after.verdict : f===0 ? R.before.verdict : `Fix ${left} more answer${left>1?'s':''} first`;
  r.frac=f; r.fixedAtRun=fixedNow; r.orderOn=st().s3.order; r.run=(st().s5.runs||0)+1; r.topics=byTopic(r);
  return r;
}
function alloc(total, weights){
  const sum = weights.reduce((a,b)=>a+b,0)||1, raw = weights.map(w=>total*w/sum), out = raw.map(Math.floor);
  let rest = total - out.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-out[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{ if(rest>0){ out[i]++; rest--; } });
  return out;
}
function allocCap(total, weights, caps){
  const out = weights.map(()=>0); let rest = total;
  for(let it=0; it<12 && rest>0; it++){
    const idx = weights.map((_,i)=>i).filter(i=>out[i]<caps[i] && weights[i]>0);
    if(!idx.length) break;
    const add = alloc(rest, idx.map(i=>weights[i]));
    idx.forEach((i,k)=>{ const v=Math.min(add[k], caps[i]-out[i]); out[i]+=v; rest-=v; });
  }
  return out;
}
function byTopic(r){
  // Demo split of the headline totals. Question counts follow share of chats; the rest is "Other".
  // Order-status questions go to the team (a correct handoff) unless order status is on.
  const m=M(), R=m.ready, N=R.n;
  const rows = m.topics.map(t=>({name:t.name, q:Math.round(N*t.share/100), t, order:!!t.orderTopic && !r.orderOn}));
  const used = rows.reduce((a,x)=>a+x.q,0);
  if(N-used>0) rows.push({name:m.tier==='under'?'Other questions':'Other (topics not drafted)', q:N-used, t:{share:(N-used)*100/N}, other:true, order:false});
  const W=Math.round(N*r.w/100), H=Math.round(N*r.h/100);
  const unfixed = R.wrong.filter(w=>!r.fixedAtRun.includes(w.id)).map(w=>w.topic);
  const wW = rows.map(x => x.order && !unfixed.includes(x.t.id) ? 0 : unfixed.includes(x.t.id) ? 3*unfixed.filter(y=>y===x.t.id).length : (unfixed.length?.4:1)*x.t.share/10);
  const w = allocCap(W, wW, rows.map(x=>x.q));
  const h = rows.map(()=>0); let Hleft = H;
  rows.forEach((x,i)=>{ if(x.order){ const v=Math.min(x.q-w[i], Hleft); h[i]=v; Hleft-=v; } });
  const h2 = allocCap(Hleft, rows.map(x=>x.order?0:x.t.share*(x.t.pass||x.t.risky?2:1)), rows.map((x,i)=>x.q-w[i]-h[i]));
  return rows.map((x,i)=>({name:x.name, q:x.q, w:w[i], h:h[i]+h2[i], c:x.q-w[i]-h[i]-h2[i], order:x.order, other:!!x.other}));
}

      } else if(cs.status==='waiting'){
        out += `<div class="conf"><div class="ch" data-act="conf" data-a="${c.id}"><span class="spin"></span><div class="grow"><b>${esc(c.short)}</b><div class="cap">Waiting for Farah (Shipping)</div></div><button class="btn sm">Open</button></div></div>`;

          <div class="cb"><div class="twosrc">${c.sources.map(x=>`<div class="srcbox ${x.newer?'new':''}"><div class="sl"><span>${esc(x.name)} · ${esc(x.date)}</span>${x.newer?'<span class="chip ok" style="height:20px">Newer</span>':''}</div><div class="q">"${esc(x.text)}"</div></div>`).join('')}</div>
          <div class="banner warn mt16" style="font-weight:500">${ic('info',16)} ${esc(c.impact)}</div></div></div>`;
      } else {

      }
    });

  if(m.s2.alsoFlag) out += `<div class="banner warn mt12">${ic('alert',16)} Also flagged: ${esc(m.s2.alsoFlag)} <span class="act cap">Your agent won't offer it.</span></div>`;
  if(m.s2.gaps && c2.loaded){
    const done = s.flags[m.s2.gaps.flag];
    out += `<div class="card mt24 row" style="padding:18px 22px"><span class="icon-tile" style="background:var(--warn-bg);color:var(--warn)">${ic('info',20)}</span><div class="grow"><div class="h3">Gaps we found</div><div class="muted">${esc(m.s2.gaps.text)}</div></div>
      ${done?`<span class="chip ok">${ic('check',12,2.5)} Passed to your beauty advisor</span>`:`<button class="btn sm" data-act="gaps">${esc(m.s2.gaps.action)}</button>`}</div>`;
  }
  out += `<h2 class="h2 mt32" style="margin-bottom:12px">Your sources</h2><div class="card" style="padding:0;overflow:hidden">`;
  srcs.forEach(f => {
    const [icn,bg,fg] = srcIcon(f.kind), isOpen = c2.open[f.id]!==undefined ? c2.open[f.id] : !!(f.warns && f.warns.some(w=>!c2.warn[w.id]));

    const stat = f.warns ? (warnsOpen.length ? `<span class="chip warn">${ic('alert',12)} ${esc(f.status)}</span>` : `<span class="chip ok">${ic('check',12,2.5)} ${esc(f.statusFixed)}</span>`) : `<span class="chip ok">${ic('check',12,2.5)} ${esc(f.status)}</span>`;
    out += `<div class="src"><div class="src-h" data-act="srcToggle" data-a="${f.id}"><span class="icon-tile" style="background:${bg};color:${fg}">${ic(icn,20)}</span><div class="grow"><div class="b" style="font-weight:600">${esc(f.name)}</div><div class="cap">${esc(f.meta)}</div></div>${stat}${ic(isOpen?'up':'down',18)}</div>`;
    if(isOpen){
      out += `<div class="src-body"><div class="sec-lbl" style="margin-bottom:6px">What we read</div>`;
      (f.warns||[]).forEach(w => { if(!c2.warn[w.id]) out += `<div class="banner warn" style="margin:6px 0 10px;align-items:flex-start">${ic('alert',16)}<div class="grow">${esc(w.text)}<div class="row mt8"><button class="btn sm" data-act="warnFix" data-a="${w.id}">${esc(w.fix)}</button><button class="btn sm ghost" data-act="docx">${esc(w.alt)}</button></div></div></div>`;

      out += `</div>`;
    }

  });

}

/* ================= Step 4: Choose how it sounds ================= */
function previewText(){
  const m=M(), v=m.voice, s=st().s4, lang=v.langOpts[s.lang]||'';
  let t;
  if(/English/.test(lang) && /Always/.test(lang) && v.a.en) t=v.a.en;
  else if(/Malay/.test(lang)) t=v.a.ms;
  else if(v.thai) t = v.a[s.speaks||'unset'] || v.a.neutral;
  else if(m.id==='jo') t = s.extra.po ? v.a.base : v.a.nopo;
  else if(v.a.base.includes('{')) t = v.a.base.replace(/\{self\}/g,s.self||'').replace(/\{Self\}/g,(s.self||'').replace(/^./,c=>c.toUpperCase())).replace(/\{addr\}/g,s.address||'');
  else t = (s.tone==='Formal' && v.a.formal) ? v.a.formal : v.a.base;
  t = t.replace(/\s*(😊|✨|🌿)+/gu,'').trim();
  if(s.emoji==='A few') t += ' 😊'; else if(s.emoji==='Lots') t += ' 😊✨';
  return t;
}
function segField(title, sub, key, opts, def, extra=''){
  const s=st().s4, val = s[key];

function liveCounts(done){

/* ---------------- Footer (sticky, one primary) ---------------- */
function renderFooter(){
  const s=st(), m=M(), el=$('footer'), sc=s.screen;
  if(sc==='home'){ el.hidden=true; return; }
  el.hidden=false;
  const back = n => `<button class="btn" data-act="go" data-a="${n<=1?'home':'s'+(n-1)}">${n<=1?'Back to setup':ic('left',16)+' Back'}</button><span class="saved">${ic('check',15,2.2)} Progress saved</span>`;
  let left='', hint='', warn=false, prim='';
  const n = +sc.slice(1);
  left = back(n);
  if(n===1){
    const ok = s.s1.consent && connectedCustomer().length>0;
    if(s.s1.read) prim = `<button class="btn primary" data-act="next" data-a="1">Continue ${ic('arrow',16)}</button>`;
    else { hint = s.s1.reading ? 'Reading your chats…' : !s.s1.consent ? 'Turn on "Let Zaapi read your past chats" to continue' : !ok ? 'Connect at least one channel your customers use' : 'Nothing is sent to customers'; warn=!ok&&!s.s1.reading;
      prim = `<button class="btn primary" data-act="readChats" ${ok&&!s.s1.reading?'':'disabled'}>${s.s1.reading?'<span class="spin"></span> Reading…':'Read my past chats'} ${s.s1.reading?'':ic('arrow',16)}</button>`; }
  } else if(n===2){
    const b = blockers2(); hint = b[0]||''; warn = !!b.length;
    if(m.guided && !b.length) hint = 'All 8 answered or skipped';
    prim = `<button class="btn primary" data-act="next" data-a="2" ${b.length?'disabled':''}>Continue ${ic('arrow',16)}</button>`;
  } else if(n===3){
    const left3 = m.topics.filter(t=>topicStatus(t.id)==='review').length;
    hint = left3 ? `Review ${left3} more topic${left3>1?'s':''} to continue` : 'You can turn topics on or off later'; warn=!!left3;
    prim = `<button class="btn primary" data-act="next" data-a="3" ${left3?'disabled':''}>Continue ${ic('arrow',16)}</button>`;
  } else if(n===4){
    const unset = s.s4.speaks==null; hint = unset ? 'Choose how your shop speaks to continue' : 'You can change tone and language any time'; warn=unset;
    prim = `<button class="btn primary" data-act="next" data-a="4" ${unset?'disabled':''}>Continue ${ic('arrow',16)}</button>`;
  } else if(n===5){
    const r = s.s5.result, allFixed = m.ready.wrong.every(wrongFixed);
    left = back(5) + (r?`<button class="btn" data-act="run" ${s.s5.running?'disabled':''}>${ic('refresh',16)} Re-run test</button><span class="cap">Last run: run ${r.run}</span>`:'');
    if(s.s5.running){ hint='Test running. You can leave this page.'; prim=`<button class="btn primary" disabled>Continue to go live small</button>`; }
    else if(!r){ hint='Start the test above'; prim=`<button class="btn primary" disabled>Continue to go live small</button>`; }
    else if(r.frac===1){ hint='Your agent passed. Next, go live small.'; prim=`<button class="btn primary" data-act="next" data-a="5">Continue to go live small ${ic('arrow',16)}</button>`; }
    else if(allFixed){ hint='All fixed. Re-run the test to see your new score.'; left=back(5); prim=`<button class="btn primary" data-act="run">${ic('refresh',16)} Re-run test</button>`; }
    else { hint='Fix the wrong answers, then re-run'; warn=true; prim=`<button class="btn primary" disabled>Continue to go live small</button>`; }
  } else if(n===6){
    hint = s.s6.live ? 'You\'re live' : 'Go live from the launch preview';
    prim = s.s6.live ? `<button class="btn primary" data-act="go" data-a="s7">See your first week ${ic('arrow',16)}</button>` : '';
  } else if(n===7){
    const done = m.week.review.items.every((_,i)=>s.s7.rev[i]);
    if(!s.s6.live){ hint=''; prim=''; }
    else { hint = done ? 'That\'s setup done' : 'Review the flagged answers to finish'; warn=!done;
      prim = `<button class="btn primary" data-act="finish" ${done?'':'disabled'}>${isDone(7)?'Open your dashboard':'Finish setup'} ${ic('arrow',16)}</button>`; }
  }
  el.innerHTML = `<div class="fin">${left}<span class="hint ${warn?'warn':''}">${esc(hint)}</span>${prim}</div>`;
}

/* ---------------- Simulated AI (timers) ---------------- */
function guard(id, fn){ const ref = S.m[id]; return (...a) => { if(S.m[id]!==ref) return; fn(...a); }; }
function readChats(){
  const id=S.cur, s=st(), list=connectedCustomer().filter(c=>c.chats!=null);
  s.s1.reading=true; render();
  let i=0;
  const stepFn = guard(id, () => {
    if(i>0) s.s1.prog[list[i-1].id]='done';
    if(i<list.length){ s.s1.prog[list[i].id]='reading'; i++; if(S.cur===id) render(); setTimeout(stepFn, 700); }
    else { s.s1.reading=false; s.s1.read=true; if(S.cur===id){ render(); toast('Chats read. Your agent is drafted from them.'); } }
  });
  stepFn();
}
function loadSamples(){
  const id=S.cur, s=st(); s.s2.loading=true; s.s2.lprog=4; render();
  const iv = setInterval(guard(id, () => {
    s.s2.lprog += 7;
    if(s.s2.lprog>=100){ clearInterval(iv); s.s2.loading=false; s.s2.loaded=true; if(S.cur===id){ render(); toast('Read. See what we found below.'); } }
    else if(S.cur===id && s.screen==='s2') render();
  }), 110);
}
function runTest(){
  const id=S.cur, s=st(), c5=s.s5;
  if(c5.running) return;
  c5.running=true; c5.prog=0; c5.ticks=0; c5.open=null; render();
  const t0 = Date.now(), dur = 4800;
  const iv = setInterval(guard(id, () => {
    c5.prog = Math.min(1,(Date.now()-t0)/dur);
    c5.ticks = Math.floor(c5.prog*14);
    if(c5.prog>=1){
      clearInterval(iv);
      c5.result = computeResult(); c5.runs = c5.result.run; c5.running=false;
      if(S.cur===id){ render(); if(s.screen!=='s5') toast('Your readiness results are ready.'); }
    } else if(S.cur===id && s.screen==='s5'){ renderPage(); renderFooter(); }
  }), 120);
}
function retest(cid){
  const id=S.cur, s=st(), cs=s.s2.conf[cid]; cs.retest='running'; cs.rprog=5; render();
  const iv = setInterval(guard(id, () => {
    cs.rprog += 9;
    if(cs.rprog>=100){ clearInterval(iv); cs.retest='done'; cs.status='settled'; if(S.cur===id){ render(); toast('Settled. Your agent will use this answer.'); } }
    else if(S.cur===id) renderLayer();
  }), 180);
}

/* ---------------- Actions ---------------- */
function openConflict(cid){ S.drawer={type:'conf', id:cid}; render(); }
function applyFix(wid){
  const m=M(), s=st(), w=m.ready.wrong.find(x=>x.id===wid), need=w.needs.find(r=>!met(r));
  if(!need) return;
  if(need.conflict || need.pick){ S.returnTo='s5'; s.screen='s2'; s.seen[2]=true; S.drawer={type:'conf', id:need.conflict||need.pick[0]}; render(false); return; }
  if(need.warn){ S.returnTo='s5'; s.screen='s2'; s.seen[2]=true; s.s2.open[m.s2.samples[0].id]=true; S.modal={type: need.warn==='p3'?'products':'glow'}; render(false); return; }
  if(need.topic){ s.s3.t[need.topic]='accepted'; toast(`Accepted the drafted "${m.topics.find(t=>t.id===need.topic).name}" topic.`); }
  else if(need.flag){ s.flags[need.flag]=true; toast({neverStock:'"Never confirm stock" is on.', fallback:'Human fallback on: if your agent doesn\'t reply within 30 seconds, a person takes over.', advisor:'Mixing and pregnancy questions now go to your beauty advisor.'}[need.flag]||'Fixed.'); }
  else if(need.orderStatus){ s.s3.order=true; toast('Order status is on (projected, weeks 6–12).'); }
  else if(need.voice){ s.s4.speaks=need.voice; toast('Your shop now speaks as a woman (ค่ะ, ดิฉัน).'); }
  else if(need.guided!=null){ s.s2.g.ans[need.guided]=m.guidedQs[need.guided].a; toast(`Added: ${m.guidedQs[need.guided].a}`); }
  if(!wrongFixed(w)) return applyFix(wid);
  render();
}
function backIfFromTest(){ if(S.returnTo==='s5'){ S.returnTo=null; go('s5'); } else render(); }
function completeAll(){
  const m=M(), s=st();
  m.channels.forEach(c=>{ if(!c.unsupported && !c.optional) s.s1.conn[c.id]=true; s.s1.prog[c.id]='done'; }); s.s1.read=true;
  s.s2.loaded=true;
  m.s2.conflicts.forEach(c=>{ s.s2.conf[c.id]={status:'settled', pick:c.pick?(c.pick.options.find(o=>o.rec)||c.pick.options[0]).id:null, gap:c.gap?'pass':null, order:c.order?[...c.order.list]:null, fallback:true, retest:c.retest?'done':'no', expand:{}, write:''}; });
  allWarns().forEach(w=>s.s2.warn[w.id]=true);
  ['neverStock','fallback','advisor'].forEach(f=>s.flags[f]=true);
  if(m.guided) m.guidedQs.forEach((q,i)=>s.s2.g.ans[i]=q.a);
  m.topics.forEach(t=>s.s3.t[t.id]='accepted'); s.s3.order=true;
  if(s.s4.speaks==null) s.s4.speaks='woman';
  [2,3,4,7].forEach(n=>s.done[n]=true);
  s.s5.result = computeResult(); s.s5.runs=s.s5.result.run;
  s.s6.live=true; m.week.review.items.forEach((_,i)=>s.s7.rev[i]='Looks right');
  for(let n=1;n<=7;n++) s.seen[n]=true;
  s.trackerView=false; S.sw=false; go('home'); toast('Demo: all 7 steps completed.', true);
}

  ccopy(){ const c=M().s2.conflicts.find(x=>x.id===S.drawer.id), cs=st().s2.conf[c.id]; cs.copied=true;
    try{ navigator.clipboard && navigator.clipboard.writeText(c.source.copy).catch(()=>{}); }catch(e){} render(); toast('Copied the updated text. Paste it into your website.'); },
  csave(){ const c=M().s2.conflicts.find(x=>x.id===S.drawer.id), cs=st().s2.conf[c.id];
    if(c.kind==='ack'){ cs.status='settled'; render(); toast('Noted.'); return; }
    if(c.retest) retest(c.id); else { cs.status='settled'; render(); toast('Settled. Your agent will use this answer.'); } },
  gaps(){ const m=M(); st().flags[m.s2.gaps.flag]=true; render(); toast('Mixing and pregnancy questions now go to your beauty advisor.'); },
  warnFix(id){ S.modal={type: id==='p3'?'products':'glow'}; render(); },
  docx(){ const id=S.cur, s=st(); toast('Reading glow_lab_faq.docx…', true); setTimeout(guard(id,()=>{ allWarns().forEach(w=>s.s2.warn[w.id]=true); render(); toast('Read all 12 pages from the .docx.'); }),1600); },
  fillProducts(){ S.modal.filled=true; render(); },
  confirmProducts(){ st().s2.warn.p3=true; S.modal=null; backIfFromTest(); toast('5 products confirmed, with prices, sizes and อย. numbers.'); },
  glowFill(){ S.modal.v='10% off in your birthday month'; render(); },
  glowSave(){ st().s2.warn.p11=true; S.modal=null; backIfFromTest(); toast('Glow Club facts confirmed.'); },
  // guided
  glang(a){ st().s2.g.lang=a; render(); },
  gchip(a){ st().s2.g.draft=a; render(); },
  gnext(){ const m=M(), g=st().s2.g, q=m.guidedQs[g.i]; const v=(g.draft!=null?g.draft:(g.ans[g.i]||q.a)).trim();
    if(v){ g.ans[g.i]=v; delete g.skip[g.i]; } g.draft=null; if(g.i<m.guidedQs.length-1) g.i++; else g.i=m.guidedQs.length; render(); },
  gskip(){ const m=M(), g=st().s2.g; g.skip[g.i]=true; delete g.ans[g.i]; g.draft=null; if(g.i<m.guidedQs.length-1) g.i++; else g.i=m.guidedQs.length; render(); },
  gprev(){ const g=st().s2.g; g.draft=null; g.i=Math.max(0,Math.min(g.i,M().guidedQs.length)-1); render(); },
  gto(j){ const g=st().s2.g; g.draft=null; g.i=+j; render(); },
  // step 3
  tf(a){ st().s3.filter=a; render(); },
  topen(id){ const c3=st().s3; c3.open = c3.open===id ? '__none' : id; render(); },
  tacc(id){ const s=st(); s.s3.t[id]= s.s3['r_'+id] ? 'edited' : 'accepted'; s.s3.open=null; s.s3.edit=null; render(); },
  toff(id){ const s=st(); s.s3.t[id] = s.s3.t[id]==='off' ? 'review' : 'off'; s.s3.open=null; render(); },
  tedit(id){ st().s3.edit=id; st().s3.open=id; render(); },
  tsave(id){ const s=st(), v=s.s3['d_'+id]; if(v!=null) s.s3['r_'+id]=v; s.s3.t[id]='edited'; s.s3.edit=null; s.s3.open=null; render(); toast('Saved your version of the rule.'); },
  tcancel(){ st().s3.edit=null; render(); },
  acceptAll(){ const s=st(); M().topics.forEach(t=>{ if(topicStatus(t.id)==='review') s.s3.t[t.id]='accepted'; }); s.s3.open=null; render(); },
  flag(k){ const s=st(); if(k==='neverStock'){ s.flags.neverStock=!s.flags.neverStock; render(); } },
  order(){ const s=st(); s.s3.order=!s.s3.order; render(); },
  build(){ const m=M(); S.modal={type:'build', name:(m.more||[[''] ])[0][0], rule:'', pass:'Your team'}; render(); },
  bsave(){ const md=S.modal; st().s3.custom.push({name:md.name, rule:md.rule.trim(), pass:md.pass==='Your team'?'':md.pass}); S.modal=null; render(); toast(`Added "${md.name}". It's on for your team to check.`); },
  // step 4
  v(k,val){ st().s4[k]=val; render(); },
  vlang(i){ st().s4.lang=+i; render(); },
  vx(k){ const e=st().s4.extra; e[k]=!e[k]; render(); },
  // step 5
  run(){ runTest(); },
  wopen(id,_,el,e){ if(e.target.closest('[data-act="fix"]')) return; st().s5.open=id; render(); },
  fix(id){ applyFix(id); },
  // step 6
  gch(id){ const c=st().s6.channels, i=c.indexOf(id); if(i>=0) c.splice(i,1); else c.push(id); render(); },
  ghr(h){ st().s6.hours=h; render(); },
  gtp(id){ const t=st().s6.topics; t[id]=!t[id]; render(); },
  gx(){ const s=st(); s.s6.xtopic=!s.s6.xtopic; render(); },
  gap(){ const s=st(); s.s6.approve=!s.s6.approve; render(); },
  gfb(){ const s=st(); s.s6.fallback=!s.s6.fallback; s.flags.fallback=s.s6.fallback; render(); },
  grem(k){ const r=st().s6.remind; r[k]=!r[k]; render(); },
  golive(){ const id=S.cur, s=st(); s.s6.going=true; render(); setTimeout(guard(id,()=>{ s.s6.going=false; s.s6.live=true; if(S.cur===id){ render(); toast(`Live on ${liveSummary()}. Nothing else changed.`); } }),1300); },
  // step 7
  pause(){ const s=st(); s.paused=!s.paused; render(); toast(s.paused?'Agent paused. Your team gets every chat.':'Agent resumed.'); },
  review(){ S.modal={type:'review'}; render(); },
  rev(i,b){ st().s7.rev[i]=b; render(); }
};
const IN = {
  jump(v){ if(!v) return; S.sw=false; if(v==='dash') return completeAll(); if(v==='home') return ACT.home(); go(v); },
  gdraft(v){ st().s2.g.draft=v; const p=document.querySelector('.fcard.pend div.mt8'); if(p) p.textContent='"'+v+'"'; },
  tedit(v,el){ st().s3['d_'+el.dataset.a]=v; },
  cwrite(v){ const c=M().s2.conflicts.find(x=>x.id===S.drawer.id), cs=st().s2.conf[c.id]; cs.write=v; const b=document.querySelector('[data-act="csave"]'); if(b) b.disabled = !(v.trim() && (!c.gap||cs.gap)); },
  gcap(v){ st().s6.cap=v; },
  ghand(v,el){ st().s6.handoffs[+el.dataset.a]=v; },
  glow(v){ S.modal.v=v; const b=document.querySelector('[data-act="glowSave"]'); if(b) b.disabled=!v.trim(); },
  bname(v){ S.modal.name=v; }, bpass(v){ S.modal.pass=v; },
  brule(v){ S.modal.rule=v; const b=document.querySelector('[data-act="bsave"]'); if(b) b.disabled=!v.trim(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(S.sw && !e.target.closest('.demo')){ S.sw=false; renderTop(); }
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn && !el.disabled) fn(el.dataset.a, el.dataset.b, el, e);
});
document.addEventListener('input', e => { const el=e.target.closest('[data-in]'); if(el && IN[el.dataset.in] && el.tagName!=='SELECT') IN[el.dataset.in](el.value, el); });
document.addEventListener('change', e => { const el=e.target.closest('[data-in]'); if(el && IN[el.dataset.in] && el.tagName==='SELECT') IN[el.dataset.in](el.value, el); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(S.modal){ S.modal=null; render(); } else if(S.drawer){ S.drawer=null; render(); } else if(S.sw){ S.sw=false; renderTop(); } }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='b'){ e.preventDefault(); ACT.sub(); }
});
// Dummy uploads: any file is accepted, nothing is read.
const fileIn = document.createElement('input'); fileIn.type='file'; fileIn.id='fileIn'; fileIn.hidden=true; fileIn.multiple=true; document.body.appendChild(fileIn);
fileIn.addEventListener('change', () => { const n=[...fileIn.files].map(f=>f.name); fileIn.value=''; if(n.length) toast(`Added ${n.join(', ')}. In this prototype nothing is read. Use the sample files to see what Zaapi reads.`, true); });
document.addEventListener('dragover', e => { if(e.target.closest('.drop')){ e.preventDefault(); e.target.closest('.drop').classList.add('over'); } });
document.addEventListener('dragleave', e => { const d=e.target.closest('.drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d=e.target.closest('.drop'); if(!d) return; e.preventDefault(); d.classList.remove('over'); const n=[...e.dataTransfer.files].map(f=>f.name); if(n.length) toast(`Added ${n.join(', ')}. In this prototype nothing is read. Use the sample files to see what Zaapi reads.`, true); });

render(false);
</script>
